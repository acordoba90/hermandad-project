        - sql:
            splitStatements: false
            sql: |
              INSERT INTO economia_hermandad
                (uuid, uuid_hermandad, saldo_actual, ingresos_mensuales, gastos_mensuales, deuda_actual, patrimonio_estimado, nivel_estabilidad_economica, fecha_ultima_actualizacion)
              SELECT
                UUID(), h.id, 0, 0, 0, 0, 0, 5, CURDATE()
              FROM hermandades h
              LEFT JOIN economia_hermandad e ON e.uuid_hermandad = h.id
              WHERE e.uuid_hermandad IS NULL;

