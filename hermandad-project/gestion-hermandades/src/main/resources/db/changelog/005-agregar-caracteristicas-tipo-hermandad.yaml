databaseChangeLog:
  - changeSet:
      id: 015-actualizar-descripciones-tipo-hermandad
      author: codex
      changes:
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Evento o grupo vecinal/devocional muy básico, normalmente centrado en una cruz, una pequeña procesión infantil o una actividad popular de barrio. Representa el inicio más humilde antes de constituirse como asociación formal."
            where: codigo = 'CRUZ_DE_MAYO'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Grupo de personas con fines culturales, sociales o devocionales, pero sin reconocimiento eclesiástico oficial como corporación religiosa."
            where: codigo = 'ASOCIACION_CIVIL'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Grupo vinculado a una parroquia concreta, con cierta actividad religiosa organizada, pero aún sin reconocimiento pleno como agrupación o hermandad."
            where: codigo = 'ASOCIACION_PARROQUIAL'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Entidad religiosa reconocida por la autoridad eclesiástica local, normalmente como paso previo a convertirse en hermandad."
            where: codigo = 'AGRUPACION_PARROQUIAL'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Hermandad centrada en advocaciones gloriosas de la Virgen o santos, normalmente con procesiones festivas y no penitenciales."
            where: codigo = 'HERMANDAD_GLORIA'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Hermandad dedicada principalmente al culto eucarístico y sacramental, con gran importancia litúrgica y parroquial."
            where: codigo = 'HERMANDAD_SACRAMENTAL'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Corporación religiosa organizada que realiza actos públicos de culto y puede participar oficialmente en celebraciones procesionales."
            where: codigo = 'COFRADIA'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Hermandad orientada específicamente a la estación de penitencia, con carácter solemne, devocional y fuerte tradición procesional."
            where: codigo = 'HERMANDAD_PENITENCIA'
        - update:
            tableName: tipo_hermandad
            columns:
              - column:
                  name: descripcion
                  value: "Corporación de especial relevancia histórica o eclesiástica, normalmente con privilegios, distinciones honoríficas y gran peso institucional."
            where: codigo = 'ARCHICOFRADIA'

  - changeSet:
      id: 016-crear-tipo-hermandad-caracteristicas
      author: codex
      changes:
        - createTable:
            tableName: tipo_hermandad_caracteristicas
            columns:
              - column:
                  name: uuid
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tipo_hermandad_uuid
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: resumen_jugable
                  type: VARCHAR(500)
              - column:
                  name: coste_mantenimiento_base
                  type: DECIMAL(12,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: ingresos_base
                  type: DECIMAL(12,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: dificultad_base
                  type: INT
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: devocion_base
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: influencia_eclesiastica_base
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: influencia_social_base
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: capacidad_crecimiento
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: permite_carrera_oficial
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: permite_patrimonio_avanzado
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: permite_banda_musica
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: permite_cuerpo_nazarenos
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: permite_cuadrilla_costaleros
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: tipo_previo_requerido
                  type: VARCHAR(50)
              - column:
                  name: requisitos_evolucion
                  type: VARCHAR(1000)
              - column:
                  name: fecha_creacion
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: fecha_actualizacion
                  type: DATETIME
        - addUniqueConstraint:
            tableName: tipo_hermandad_caracteristicas
            columnNames: tipo_hermandad_uuid
            constraintName: uk_tipo_hermandad_caracteristicas_tipo
        - addForeignKeyConstraint:
            constraintName: fk_tipo_hermandad_caracteristicas_tipo
            baseTableName: tipo_hermandad_caracteristicas
            baseColumnNames: tipo_hermandad_uuid
            referencedTableName: tipo_hermandad
            referencedColumnNames: uuid

  - changeSet:
