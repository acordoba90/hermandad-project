                     100.00, 250.00, 1, 5, 0, 15, 90, 0, 0, 0, 0, 0,
                     NULL,
                     'Alcanzar suficiente apoyo vecinal, organizar varios cultos o actos externos y formalizar una asociación.',
                     NOW(), NOW()
