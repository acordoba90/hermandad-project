databaseChangeLog:
  - changeSet:
      id: 001-crear-tablas-pasos
      author: codex
      changes:
        - createTable:
            tableName: plantillas_paso
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: codigo
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: nombre
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: descripcion
                  type: VARCHAR(500)
              - column:
                  name: tipo
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: url_recurso
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: precio
                  type: DECIMAL(12,2)
                  constraints:
                    nullable: false
              - column:
                  name: prestigio_requerido
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: activo
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: fecha_creacion
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: fecha_actualizacion
                  type: DATETIME
