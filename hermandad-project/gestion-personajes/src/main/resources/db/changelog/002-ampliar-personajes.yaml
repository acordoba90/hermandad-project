databaseChangeLog:
  - changeSet:
      id: 002-ampliar-personajes
      author: codex
      changes:
        - addColumn:
            tableName: personajes
            columns:
              - column:
                  name: id_usuario
                  type: CHAR(36)
              - column:
                  name: id_avatar
                  type: CHAR(36)
              - column:
                  name: profesion
                  type: VARCHAR(150)
              - column:
                  name: biografia
                  type: TEXT
              - column:
                  name: motivacion
                  type: TEXT
              - column:
                  name: tipo_personaje
                  type: VARCHAR(100)
              - column:
                  name: personalizado
                  type: BOOLEAN
