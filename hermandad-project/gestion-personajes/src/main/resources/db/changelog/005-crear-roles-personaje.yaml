                UNION ALL SELECT 'CONSEJO_HERMANDADES', 'PRESIDENTE_CONSEJO', 'Presidente del Consejo', 'Maximo representante del Consejo de Hermandades.'
                UNION ALL SELECT 'CONSEJO_HERMANDADES', 'CONSEJERO', 'Consejero', 'Miembro encargado de colaborar en la coordinacion de las hermandades.'
                UNION ALL SELECT 'CONSEJO_HERMANDADES', 'DELEGADO_DIA', 'Delegado de dia', 'Responsable de supervisar las hermandades asignadas durante una jornada procesional.'
                UNION ALL SELECT 'CONSEJO_HERMANDADES', 'RESPONSABLE_HORARIOS_ITINERARIOS', 'Responsable de horarios e itinerarios', 'Persona encargada de coordinar horarios, recorridos y posibles conflictos.'
                UNION ALL SELECT 'MEDIOS_COMUNICACION', 'PERIODISTA', 'Periodista', 'Profesional encargado de informar sobre la actualidad cofrade.'
                UNION ALL SELECT 'MEDIOS_COMUNICACION', 'PRESENTADOR', 'Presentador', 'Profesional encargado de conducir programas y espacios informativos.'
                UNION ALL SELECT 'MEDIOS_COMUNICACION', 'LOCUTOR_RADIO', 'Locutor de radio', 'Profesional encargado de comunicar y narrar contenidos radiofonicos.'
                UNION ALL SELECT 'MEDIOS_COMUNICACION', 'FOTOGRAFO', 'Fotografo', 'Profesional encargado de documentar graficamente cultos y procesiones.'
                UNION ALL SELECT 'MEDIOS_COMUNICACION', 'REPORTERO', 'Reportero', 'Profesional encargado de cubrir actos y acontecimientos sobre el terreno.'
                UNION ALL SELECT 'MEDIOS_COMUNICACION', 'TERTULIANO', 'Tertuliano', 'Colaborador que participa en debates y espacios de opinion.'
                UNION ALL SELECT 'REDES_SOCIALES', 'INFLUENCER_COFRADE', 'Influencer cofrade', 'Creador con capacidad para influir en la opinion publica cofrade.'
                UNION ALL SELECT 'REDES_SOCIALES', 'CREADOR_CONTENIDO', 'Creador de contenido', 'Persona dedicada a crear videos, fotografias, publicaciones y otros contenidos digitales.'
                UNION ALL SELECT 'REDES_SOCIALES', 'COMMUNITY_MANAGER', 'Community manager', 'Responsable de gestionar la comunicacion y las redes sociales de una organizacion.'
