                UNION ALL SELECT 'CLERO_PARROQUIA', 'PARROCO', 'Parroco', 'Sacerdote responsable de la parroquia y su comunidad.'
                UNION ALL SELECT 'CLERO_PARROQUIA', 'VICARIO_PARROQUIAL', 'Vicario parroquial', 'Sacerdote que auxilia al parroco en sus funciones.'
                UNION ALL SELECT 'CLERO_PARROQUIA', 'DIRECTOR_ESPIRITUAL', 'Director espiritual', 'Sacerdote encargado del acompanamiento espiritual de la hermandad.'
