databaseChangeLog:
  - changeSet:
      id: 005-crear-tabla-roles-personaje
      author: codex
      changes:
        - createTable:
            tableName: roles_personaje
            columns:
              - column:
                  name: id
                  type: CHAR(36)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles_personaje
                    nullable: false
              - column:
                  name: colectivo_id
                  type: CHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: codigo
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: nombre
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: descripcion
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: activo
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: fecha_creacion
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: fecha_actualizacion
                  type: DATETIME
        - addForeignKeyConstraint:
            baseTableName: roles_personaje
            baseColumnNames: colectivo_id
            constraintName: fk_roles_personaje_colectivo
            referencedTableName: colectivos
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: roles_personaje
            columnNames: colectivo_id, codigo
            constraintName: uk_roles_personaje_colectivo_codigo
        - createIndex:
            tableName: roles_personaje
            indexName: idx_roles_personaje_activo
            columns:
              - column:
                  name: activo
  - changeSet:
      id: 005-anadir-rol-personaje-a-personajes
      author: codex
      changes:
        - addColumn:
            tableName: personajes
            columns:
              - column:
                  name: rol_personaje_id
                  type: CHAR(36)
        - addForeignKeyConstraint:
            baseTableName: personajes
            baseColumnNames: rol_personaje_id
            constraintName: fk_personajes_rol_personaje
            referencedTableName: roles_personaje
            referencedColumnNames: id
        - createIndex:
            tableName: personajes
            indexName: idx_personajes_rol_personaje
            columns:
              - column:
                  name: rol_personaje_id
  - changeSet:
      id: 005-cargar-catalogo-roles-personaje
      author: codex
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO roles_personaje (id, colectivo_id, codigo, nombre, descripcion, activo, fecha_creacion)
              SELECT r_new.id, colectivos.id, r_new.codigo, r_new.nombre, r_new.descripcion, TRUE, CURRENT_TIMESTAMP
              FROM colectivos
              JOIN (
                SELECT '50000000-0000-0000-0000-000000000001' AS id, 'JUNTA_GOBIERNO' AS colectivo_codigo, 'HERMANO_MAYOR' AS codigo, 'Hermano Mayor' AS nombre, 'Maxima autoridad de la hermandad y principal responsable de su direccion, representacion y toma de decisiones.' AS descripcion
                UNION ALL SELECT '50000000-0000-0000-0000-000000000002', 'JUNTA_GOBIERNO', 'TENIENTE_HERMANO_MAYOR', 'Teniente de Hermano Mayor', 'Sustituye y asiste al Hermano Mayor, colaborando en la coordinacion general de la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000003', 'JUNTA_GOBIERNO', 'MAYORDOMO', 'Mayordomo', 'Responsable de la gestion economica, patrimonial y material de la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000004', 'JUNTA_GOBIERNO', 'SECRETARIO', 'Secretario', 'Responsable de actas, comunicaciones oficiales, documentacion y gestion administrativa.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000005', 'JUNTA_GOBIERNO', 'FISCAL', 'Fiscal', 'Responsable de velar por el cumplimiento de las reglas, acuerdos y normas de la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000006', 'JUNTA_GOBIERNO', 'DIPUTADO_MAYOR_GOBIERNO', 'Diputado Mayor de Gobierno', 'Responsable de la organizacion del cortejo, la estacion de penitencia y el orden procesional.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000007', 'JUNTA_GOBIERNO', 'PRIOSTE', 'Prioste', 'Responsable de cultos, altares, pasos, insignias y enseres de la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000008', 'JUNTA_GOBIERNO', 'CONSILIARIO', 'Consiliario', 'Miembro de la Junta encargado de asesorar y colaborar en las decisiones de gobierno.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000009', 'JUNTA_GOBIERNO', 'DIPUTADO_CULTOS', 'Diputado de Cultos', 'Responsable de organizar y coordinar los cultos internos y externos.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000010', 'JUNTA_GOBIERNO', 'DIPUTADO_CARIDAD', 'Diputado de Caridad', 'Responsable de coordinar la accion social y asistencial de la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000011', 'JUNTA_GOBIERNO', 'DIPUTADO_FORMACION', 'Diputado de Formacion', 'Responsable de organizar actividades formativas y religiosas para los hermanos.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000012', 'JUNTA_GOBIERNO', 'DIPUTADO_JUVENTUD', 'Diputado de Juventud', 'Responsable de coordinar las actividades y participacion de los jovenes.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000013', 'JUNTA_GOBIERNO', 'VOCAL_JUNTA', 'Vocal de Junta', 'Miembro de la Junta que colabora en las distintas areas de gestion.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000014', 'HERMANOS', 'HERMANO', 'Hermano', 'Miembro ordinario perteneciente a la corporacion.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000015', 'HERMANOS', 'HERMANO_VETERANO', 'Hermano veterano', 'Miembro con amplia antiguedad, experiencia y conocimiento de la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000016', 'HERMANOS', 'HERMANO_NUEVO', 'Hermano nuevo', 'Miembro recientemente incorporado a la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000017', 'HERMANOS', 'HERMANO_BENEFACTOR', 'Hermano benefactor', 'Hermano que realiza aportaciones economicas o materiales relevantes.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000018', 'HERMANOS', 'HERMANO_HONORARIO', 'Hermano honorario', 'Persona distinguida por su especial vinculacion o contribucion a la hermandad.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000019', 'CORTEJO_PROCESIONAL', 'NAZARENO_CIRIO', 'Nazareno de cirio', 'Nazareno que participa en el cortejo portando un cirio.'
                UNION ALL SELECT '50000000-0000-0000-0000-000000000020', 'CORTEJO_PROCESIONAL', 'NAZARENO_CRUZ', 'Nazareno de cruz', 'Penitente que participa en el cortejo portando una cruz.'
