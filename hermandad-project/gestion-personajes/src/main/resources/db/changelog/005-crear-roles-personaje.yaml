                UNION ALL SELECT 'GRUPO_JOVEN', 'MONITOR_JUVENIL', 'Monitor juvenil', 'Persona encargada de acompanar y organizar actividades destinadas a menores y jovenes.'
                UNION ALL SELECT 'ACCION_SOCIAL', 'COORDINADOR_ACCION_SOCIAL', 'Coordinador de Accion Social', 'Responsable de planificar y coordinar las actividades sociales y asistenciales.'
