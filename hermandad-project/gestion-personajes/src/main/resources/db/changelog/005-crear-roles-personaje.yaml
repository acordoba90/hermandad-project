                UNION ALL SELECT 'PRIOSTIA', 'ENCARGADO_CERA', 'Encargado de cera', 'Responsable de preparar y conservar cirios, velas y demas elementos de cera.'
                UNION ALL SELECT 'PRIOSTIA', 'MONTADOR_CULTOS', 'Montador de cultos', 'Persona encargada de preparar altares y espacios para los cultos.'
                UNION ALL SELECT 'PRIOSTIA', 'CONSERVADOR_PATRIMONIO', 'Conservador de patrimonio', 'Responsable del seguimiento y conservacion preventiva de los bienes patrimoniales.'
                UNION ALL SELECT 'ADMINISTRACION', 'ADMINISTRADOR', 'Administrador', 'Responsable de coordinar la gestion administrativa de la hermandad.'
                UNION ALL SELECT 'ADMINISTRACION', 'TESORERO', 'Tesorero', 'Responsable del control de ingresos, gastos y cuentas.'
                UNION ALL SELECT 'ADMINISTRACION', 'CONTABLE', 'Contable', 'Profesional encargado del registro y seguimiento contable.'
                UNION ALL SELECT 'ADMINISTRACION', 'ARCHIVERO', 'Archivero', 'Responsable de conservar y organizar el archivo documental.'
                UNION ALL SELECT 'ADMINISTRACION', 'AUXILIAR_ADMINISTRATIVO', 'Auxiliar administrativo', 'Persona que presta apoyo en tareas administrativas y de atencion.'
                UNION ALL SELECT 'ADMINISTRACION', 'RESPONSABLE_ATENCION_HERMANOS', 'Responsable de atencion a hermanos', 'Persona encargada de gestionar consultas, altas, bajas y comunicaciones con los hermanos.'
                UNION ALL SELECT 'ADMINISTRACION', 'ASESOR_JURIDICO', 'Asesor juridico', 'Profesional encargado de asesorar juridicamente a la hermandad.'
                UNION ALL SELECT 'GRUPO_JOVEN', 'PRESIDENTE_GRUPO_JOVEN', 'Presidente del Grupo Joven', 'Responsable de dirigir y representar al Grupo Joven.'
                UNION ALL SELECT 'GRUPO_JOVEN', 'COORDINADOR_JUVENIL', 'Coordinador juvenil', 'Persona encargada de planificar y coordinar las actividades juveniles.'
