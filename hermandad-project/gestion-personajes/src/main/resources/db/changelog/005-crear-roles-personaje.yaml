                UNION ALL SELECT 'CANDIDATURAS', 'JEFE_CAMPANA', 'Jefe de campana', 'Responsable de coordinar la estrategia y organizacion de una candidatura.'
                UNION ALL SELECT 'CANDIDATURAS', 'INTERVENTOR_ELECTORAL', 'Interventor electoral', 'Persona encargada de supervisar el proceso electoral en representacion de una candidatura.'
                UNION ALL SELECT 'PERSONAJES_HISTORICOS', 'FUNDADOR', 'Fundador', 'Persona vinculada a la fundacion de la hermandad.'
                UNION ALL SELECT 'PERSONAJES_HISTORICOS', 'ANTIGUO_HERMANO_MAYOR', 'Antiguo Hermano Mayor', 'Persona que ejercio en el pasado como Hermano Mayor.'
                UNION ALL SELECT 'PERSONAJES_HISTORICOS', 'BENEFACTOR_HISTORICO', 'Benefactor historico', 'Persona recordada por sus aportaciones relevantes a la hermandad.'
                UNION ALL SELECT 'PERSONAJES_HISTORICOS', 'CAPATAZ_HISTORICO', 'Capataz historico', 'Capataz especialmente relevante en la historia de la corporacion.'
                UNION ALL SELECT 'PERSONAJES_CONFLICTO', 'DIFUSOR_RUMORES', 'Difusor de rumores', 'Persona que propaga informacion no confirmada y genera inestabilidad.'
                UNION ALL SELECT 'PERSONAJES_CONFLICTO', 'PROVEEDOR_INCUMPLIDOR', 'Proveedor incumplidor', 'Proveedor que no cumple los plazos, calidad o acuerdos establecidos.'
                UNION ALL SELECT 'PERSONAJES_CONFLICTO', 'PERIODISTA_SENSACIONALISTA', 'Periodista sensacionalista', 'Profesional que exagera conflictos o noticias para obtener repercusion.'
                UNION ALL SELECT 'PERSONAJES_CONFLICTO', 'OPOSITOR_INTERNO', 'Opositor interno', 'Persona que se enfrenta activamente a las decisiones de la direccion.'
                UNION ALL SELECT 'PERSONAJES_CONFLICTO', 'VANDALO', 'Vandalo', 'Persona capaz de causar danos materiales o alteraciones del orden.'
              ) r_new ON r_new.colectivo_codigo = colectivos.codigo
              WHERE NOT EXISTS (
                SELECT 1
                FROM roles_personaje rp
                WHERE rp.colectivo_id = colectivos.id
                  AND rp.codigo = r_new.codigo
              );
