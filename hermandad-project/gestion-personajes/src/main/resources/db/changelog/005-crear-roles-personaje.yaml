                UNION ALL SELECT 'PROFESIONALES_ASESORES', 'ARQUITECTO', 'Arquitecto', 'Profesional encargado de asesorar en edificios, reformas y espacios.'
                UNION ALL SELECT 'PROFESIONALES_ASESORES', 'DISENADOR_GRAFICO', 'Disenador grafico', 'Profesional encargado de crear elementos visuales y de comunicacion.'
                UNION ALL SELECT 'PROFESIONALES_ASESORES', 'CONSULTOR', 'Consultor', 'Profesional que presta asesoramiento especializado en gestion y estrategia.'
                UNION ALL SELECT 'BENEFACTORES', 'DONANTE', 'Donante', 'Persona que realiza aportaciones economicas o materiales.'
                UNION ALL SELECT 'BENEFACTORES', 'MECENAS', 'Mecenas', 'Persona que financia proyectos patrimoniales, artisticos o sociales.'
