                UNION ALL SELECT '50000000-0000-0000-0000-000000000022', 'CORTEJO_PROCESIONAL', 'DIPUTADO_TRAMO', 'Diputado de tramo', 'Responsable de organizar y mantener el orden dentro de un tramo de nazarenos.'
