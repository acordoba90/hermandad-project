                UNION ALL SELECT 'PUBLICO_DEVOTOS', 'PUBLICO_GENERAL', 'Publico general', 'Persona que asiste a cultos, procesiones o actividades abiertas.'
                UNION ALL SELECT 'PUBLICO_DEVOTOS', 'FOTOGRAFO_AFICIONADO', 'Fotografo aficionado', 'Persona que documenta actos y procesiones por aficion.'
                UNION ALL SELECT 'PROVEEDORES', 'PROVEEDOR', 'Proveedor', 'Profesional o empresa que suministra productos o servicios.'
                UNION ALL SELECT 'PROVEEDORES', 'CERERO', 'Cerero', 'Profesional especializado en la elaboracion y suministro de cera.'
                UNION ALL SELECT 'PROVEEDORES', 'ORFEBRE', 'Orfebre', 'Artesano especializado en trabajos de metales preciosos.'
                UNION ALL SELECT 'PROVEEDORES', 'BORDADOR', 'Bordador', 'Artesano especializado en bordados y textiles ornamentales.'
                UNION ALL SELECT 'PROVEEDORES', 'IMPRENTA', 'Responsable de imprenta', 'Profesional encargado de trabajos de impresion y material grafico.'
                UNION ALL SELECT 'PROVEEDORES', 'ASEGURADOR', 'Asegurador', 'Profesional encargado de la contratacion y gestion de seguros.'
                UNION ALL SELECT 'ARTE_PATRIMONIO', 'IMAGINERO', 'Imaginero', 'Artista especializado en la creacion de imagenes religiosas.'
