        - addForeignKeyConstraint:
            constraintName: fk_mapas_ciudad_ciudad
            baseTableName: mapas_ciudad
            baseColumnNames: ciudad_id
            referencedTableName: ciudades
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_nodos_ciudad_mapa
            baseTableName: nodos_ciudad
            baseColumnNames: mapa_ciudad_id
            referencedTableName: mapas_ciudad
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_conexiones_ciudad_mapa
            baseTableName: conexiones_ciudad
            baseColumnNames: mapa_ciudad_id
            referencedTableName: mapas_ciudad
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_conexiones_ciudad_origen
            baseTableName: conexiones_ciudad
            baseColumnNames: nodo_origen_id
            referencedTableName: nodos_ciudad
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_conexiones_ciudad_destino
            baseTableName: conexiones_ciudad
            baseColumnNames: nodo_destino_id
            referencedTableName: nodos_ciudad
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_iglesias_ciudad
            baseTableName: iglesias
            baseColumnNames: ciudad_id
            referencedTableName: ciudades
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_iglesias_nodo
            baseTableName: iglesias
            baseColumnNames: nodo_ciudad_id
            referencedTableName: nodos_ciudad
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_carreras_oficiales_ciudad
            baseTableName: carreras_oficiales
            baseColumnNames: ciudad_id
            referencedTableName: ciudades
            referencedColumnNames: id
        - addForeignKeyConstraint:
