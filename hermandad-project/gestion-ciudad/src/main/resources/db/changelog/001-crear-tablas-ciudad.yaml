            baseTableName: carreras_oficiales
            baseColumnNames: mapa_ciudad_id
            referencedTableName: mapas_ciudad
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_carreras_oficiales_entrada
            baseTableName: carreras_oficiales
            baseColumnNames: nodo_entrada_id
            referencedTableName: nodos_ciudad
            referencedColumnNames: id
        - addForeignKeyConstraint:
