services:
  api-gateway:
    image: hermandad-project/api-gateway:local
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      CONFIG_SERVER_URL: ${CONFIG_SERVER_URL:-http://config-server:8888}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      GESTION_USUARIOS_URL: ${GESTION_USUARIOS_URL:-http://host.docker.internal:8081}
      GESTION_HERMANDADES_URL: http://gestion-hermandades:8080
      GESTION_INVENTARIO_URL: http://gestion-inventario:8080
      GESTION_PERSONAJES_URL: ${GESTION_PERSONAJES_URL:-http://host.docker.internal:8084}
      GESTION_RECOMPENSAS_URL: http://gestion-recompensas:8080
      GESTION_RECORRIDOS_URL: http://gestion-recorridos:8080
      GESTION_CIUDAD_URL: http://gestion-ciudad:8080
      GESTION_PASOS_URL: http://gestion-pasos:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - hermandad-network
      - config-network

networks:
  hermandad-network:
    name: hermandad-network
  config-network:
    name: hermandad-project_default
    external: true
