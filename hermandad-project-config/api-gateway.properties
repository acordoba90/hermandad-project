server.port=${API_GATEWAY_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposed-headers=Location
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=false
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# Los servicios pueden mantener CORS para su ejecucion directa. Al pasar por el
# Gateway se conserva una unica copia de las cabeceras para que el navegador no
# rechace respuestas con Access-Control-Allow-Origin duplicado.
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST

spring.cloud.gateway.routes[0].id=gestion-usuarios
spring.cloud.gateway.routes[0].uri=${services.gestion-usuarios.url}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**,/api/usuarios-estado/**,/api/emails/**,/api/usuario-profiles/**
spring.cloud.gateway.routes[1].id=gestion-personajes
spring.cloud.gateway.routes[1].uri=${services.gestion-personajes.url}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/personajes/**,/api/arquetipos-perfil/**,/api/colectivos/**,/api/roles-personaje/**
spring.cloud.gateway.routes[2].id=gestion-hermandades
spring.cloud.gateway.routes[2].uri=${services.gestion-hermandades.url}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/gestion-hermandades/**
spring.cloud.gateway.routes[3].id=gestion-inventario
spring.cloud.gateway.routes[3].uri=${services.gestion-inventario.url}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.routes[4].id=gestion-recompensas
spring.cloud.gateway.routes[4].uri=${services.gestion-recompensas.url}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/reward-packs/**,/api/reward-pack-openings/**
spring.cloud.gateway.routes[5].id=gestion-recorridos
spring.cloud.gateway.routes[5].uri=${services.gestion-recorridos.url}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/recorridos/**
spring.cloud.gateway.routes[6].id=gestion-ciudad
spring.cloud.gateway.routes[6].uri=${services.gestion-ciudad.url}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/ciudades/**,/api/mapas-ciudad/**,/api/iglesias/**,/api/nodos-ciudad/**,/api/conexiones-ciudad/**,/api/carreras-oficiales/**
spring.cloud.gateway.routes[7].id=gestion-pasos
spring.cloud.gateway.routes[7].uri=${services.gestion-pasos.url}
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/paso-compositions/**,/api/paso-figures/**,/api/paso-slots/**,/api/paso-templates/**

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=${API_GATEWAY_LOG_LEVEL:INFO}
