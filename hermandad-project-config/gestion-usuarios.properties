spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

hermandad.mail.from=Hermandad Project <noreply@hermandadproject.com>

hermandad.user.activation.expiration-hours=24
hermandad.user.login.max-failed-attempts=5
hermandad.user.login.lock-minutes=30
hermandad.user.inactivity.disable-after-days=365

hermandad.user.password.min-length=8
hermandad.user.password.require-uppercase=true
hermandad.user.password.require-number=true
hermandad.user.password.require-special-character=true

hermandad.user.registration.alias.min-length=4
hermandad.user.registration.alias.max-length=20
hermandad.user.registration.username.max-length=100

hermandad.game.initial-level=1
hermandad.game.initial-experience=0
hermandad.game.max-level=100
hermandad.game.default-avatar=default.png

logging.level.root=INFO
logging.level.com.hermandadproject.gestionusuarios=INFO
logging.pattern.level=%5p [correlationId=%X{correlationId:-}]
